<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamFreenet — Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #0a0a18;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ❄️ SNOW EFFECT */
        #snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .snowflake {
            position: absolute;
            color: #fff;
            font-size: 16px;
            animation: snowFall linear infinite;
        }
        @keyframes snowFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0.1; }
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 2;
            max-width: 450px;
            width: 100%;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(90deg, #ffcc00, #ff8800, #ffcc00);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            animation: textGlow 3s linear infinite;
        }

        @keyframes textGlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .status-box {
            background: rgba(25, 25, 50, 0.7);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 16px;
            padding: 30px 25px;
            margin-bottom: 30px;
        }

        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }
        .loading-dots span {
            width: 10px;
            height: 10px;
            background: #ffcc00;
            border-radius: 50%;
            animation: dotPulse 1.4s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .wait-text {
            font-size: 18px;
            color: #00ffff;
            margin: 15px 0;
        }

        .owner {
            font-size: 15px;
            color: #888;
            margin-top: 20px;
        }

        .owner span {
            color: #ffcc00;
            font-weight: bold;
        }

        .telegram-link {
            margin-top: 30px;
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, #0088cc, #0099dd);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.3);
        }

        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 136, 204, 0.5);
        }
    </style>
</head>
<body>
    <div id="snow-container"></div>

    <div class="container">
        <div class="icon">🔧</div>
        <h1>MAINTENANCE BREAK</h1>
        <h2>UNDER MAINTENANCE</h2>

        <div class="status-box">
            <p class="wait-text">Please wait for update</p>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p class="owner">Owner: <span>BOYSUPOTPH</span></p>
        </div>

        <div class="telegram-link">
            <a href="https://t.me/+7JVXaDEgf2I4NWZl" target="_blank" class="telegram-btn">
                📢 Join Our Telegram for Updates
            </a>
        </div>
    </div>

    <script>
        // ❄️ FALLING SNOW
        function startSnow() {
            const container = document.getElementById('snow-container');
            const flakes = ['❄', '❅', '❆', '✻', '✼', '❉'];
            for (let i = 0; i < 40; i++) {
                const snow = document.createElement('span');
                snow.className = 'snowflake';
                snow.textContent = flakes[Math.floor(Math.random() * flakes.length)];
                snow.style.left = Math.random() * 100 + '%';
                snow.style.fontSize = (Math.random() * 10 + 8) + 'px';
                snow.style.opacity = Math.random() * 0.5 + 0.3;
                const speed = Math.random() * 6 + 6;
                snow.style.animationDuration = speed + 's';
                snow.style.animationDelay = Math.random() * speed + 's';
                container.appendChild(snow);
            }
        }
        startSnow();
    </script>
</body>
</html>
